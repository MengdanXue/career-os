spring:
  application:
    name: career-os
  datasource:
    url: ${CAREER_OS_DB_URL:jdbc:postgresql://localhost:5432/career_os}
    username: ${CAREER_OS_DB_USER:career_os}
    password: ${CAREER_OS_DB_PASSWORD:career_os}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  ai:
    model:
      chat: ${CAREER_OS_AI_CHAT_MODEL:none}
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

career-os:
  # 全站默认拒绝（HTTP Basic）。这里不放任何默认账号：
  # 未配置用户时应用会为本次进程生成一次性随机口令的 admin 并打到 WARN 日志，
  # 不会留下可猜的默认凭证。
  #
  # 部署时通过环境变量注入（Spring 宽松绑定），明文口令不进配置文件也不进仓库：
  #   CAREER_OS_SECURITY_USERS_0_USERNAME=zhang
  #   CAREER_OS_SECURITY_USERS_0_PASSWORD_HASH='$2y$12$...'
  #   CAREER_OS_SECURITY_USERS_0_ROLES_0=REVIEWER
  # 生成哈希：htpasswd -nbBC 12 "" '<password>' | cut -d: -f2
  #
  # 角色：REVIEWER 可处理复核动作；ADMIN 额外可删除资源与访问 /actuator。
  artifacts:
    root: ${CAREER_OS_ARTIFACT_ROOT:${user.dir}/var/artifacts}
  extraction:
    max-document-bytes: 26214400
    auto-accept-confidence: 0.90
    lock-pool-size: ${CAREER_OS_EXTRACTION_LOCK_POOL_SIZE:8}
    lock-connection-timeout-ms: ${CAREER_OS_EXTRACTION_LOCK_CONNECTION_TIMEOUT_MS:5000}
    # 相同指纹的并发提交在此等待前一次抽取完成（含模型往返）。
    # 已知未修：抽取模型调用仍在事务及 advisory lock 内，会占用主池连接。
    # 不能用调大等待时间或 Agent 规划器的 20 秒上限声称连接资源问题已解决。
    # 详情与回退原因见 docs/PHASE2_API.md「并发与事务边界」。
    lock-wait-timeout-ms: ${CAREER_OS_EXTRACTION_LOCK_WAIT_TIMEOUT_MS:30000}
    llm:
      enabled: ${CAREER_OS_LLM_ENABLED:false}
      model: ${CAREER_OS_AI_MODEL:gpt-5-mini}
      prompt-version: 1.0.0
      # 送入模型的证据片段字符预算。超出部分整条丢弃（不切断片段内部文本），
      # 并产生 INPUT_TRUNCATED 复核项——截断过的抽取结果不允许自动核验。
      max-prompt-characters: ${CAREER_OS_LLM_MAX_PROMPT_CHARACTERS:40000}
  acquisition:
    scheduling-enabled: ${CAREER_OS_ACQUISITION_SCHEDULING_ENABLED:true}
    dispatch-delay-ms: ${CAREER_OS_ACQUISITION_DISPATCH_DELAY_MS:60000}
    dispatch-batch-size: ${CAREER_OS_ACQUISITION_DISPATCH_BATCH_SIZE:20}
    max-document-bytes: 26214400
    http-contact: ${CAREER_OS_HTTP_CONTACT:}
    lock-pool-size: ${CAREER_OS_ACQUISITION_LOCK_POOL_SIZE:2}
    lock-connection-timeout-ms: ${CAREER_OS_ACQUISITION_LOCK_CONNECTION_TIMEOUT_MS:5000}
    lock-poll-interval-ms: ${CAREER_OS_ACQUISITION_LOCK_POLL_INTERVAL_MS:50}
    live-smoke-enabled: ${CAREER_OS_ACQUISITION_LIVE_SMOKE_ENABLED:false}
  agent:
    # 第一阶段放行条件未齐：旧 LLM 开关不能单独开启动态工具选择。
    dynamic-tools:
      enabled: ${CAREER_OS_AGENT_DYNAMIC_TOOLS_ENABLED:false}
    acceptance:
      enabled: ${CAREER_OS_AGENT_ACCEPTANCE_ENABLED:false}
    llm:
      enabled: ${CAREER_OS_AGENT_LLM_ENABLED:false}
