services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_os
      POSTGRES_USER: career_os
      POSTGRES_PASSWORD: career_os
    ports:
      - "${CAREER_OS_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_os -d career_os"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 5s
    volumes:
      - career_os_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  career_os_postgres:
