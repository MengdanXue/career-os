name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ubuntu-latest 自带 Docker，Testcontainers 集成测试必须真正执行。
      # 本地无 Docker 时这些用例会被 Assumptions 跳过，CI 上不允许。
      - name: Verify Docker is available for Testcontainers
        run: docker info

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Fail on unexpected skipped tests
        run: python3 .github/scripts/check_skipped_tests.py

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/surefire-reports/*.xml"
          if-no-files-found: warn
