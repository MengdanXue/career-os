name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    # 只在 PR 上跑：仓库既有历史没有签署行，对 push 校验会把每一次推送都判红。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # 取到能覆盖 base..head 的历史，否则下面的 rev-list 拿不到 PR 的提交。
          fetch-depth: 0
      - name: Every commit in this pull request carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              echo "::error::缺少 Signed-off-by: $(git show -s --format='%h %s' "$sha")"
              echo "           作者 $author；用 git commit -s 或 git rebase --signoff 补上"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo "::error::见 CONTRIBUTING.md 的「开发者证书（DCO）」一节"
            exit 1
          fi
          echo "本 PR 的每个提交都有签署行。"

  build:
    name: Java 21, database integration and frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test the report gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify Docker for Testcontainers
        run: docker info
      - name: Refresh Mockito agent
        run: rm -f "$HOME/.m2/repository/org/mockito/mockito-core/5.17.0/mockito-core-5.17.0.jar"
      # career-web binds frontend build, TypeScript checks and Vitest to Maven.
      # Do not pass skipTests or skip.npm here. Live network / LLM profiles remain opt-in.
      - name: Build and test all modules and frontend
        run: mvn -B -ntp clean verify -Dsurefire.argLine=
      - name: Reject missing reports, failures and unexpected skips
        if: always()
        run: python3 .github/scripts/check_skipped_tests.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
